apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://airflow.apache.org
    chart: airflow
    targetRevision: 1.15.0
    helm:
      valueFiles: []
      values: |
        # Les valeurs détaillées sont dans apps/airflow/values.yaml
        # (ArgoCD ne lit pas un fichier externe pour un chart distant,
        #  donc en pratique on colle values.yaml ici ou on utilise un plugin kustomize+helm)
  destination:
    server: https://kubernetes.default.svc
    namespace: airflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
