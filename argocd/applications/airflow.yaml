apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: airflow
  namespace: argocd

spec:
  project: default

  sources:

    - repoURL: https://airflow.apache.org
      chart: airflow
      targetRevision: 1.15.0

      helm:
        valueFiles:
          - $values/apps/airflow/values.yaml

    - repoURL: https://github.com/rasolonjanahary/ecommerce-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: airflow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true