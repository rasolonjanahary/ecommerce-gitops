executor: KubernetesExecutor

postgresql:
  enabled: true

  image:
    registry: docker.io
    repository: postgres
    tag: "16"

  auth:
    postgresPassword: "12122005"
    username: "airflow"
    password: "12122005"
    database: "airflow"

dags:
  gitSync:
    enabled: true
    repo: https://github.com/rasolonjanahary/ecommerce-gitops.git
    branch: main
    subPath: dags
    depth: 1

webserver:
  defaultUser:
    enabled: true
    username: admin
    password: "12122005"

env:
  - name: AIRFLOW_CONN_ECOMMERCE_DB
    value: "postgresql://ecommerce:12122005@postgres.ecommerce.svc.cluster.local:5432/ecommerce"

  - name: AIRFLOW_CONN_WAREHOUSE_DB
    value: "postgresql://warehouse:12122005@postgres.ecommerce.svc.cluster.local:5432/warehouse"