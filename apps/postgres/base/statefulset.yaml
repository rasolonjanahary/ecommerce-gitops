apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ecommerce
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres 
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: ecommerce
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
              
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe: 
            exec: 
              command: 
                - sh 
                - -c 
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" 
            initialDelaySeconds: 10 
            periodSeconds: 10 
            timeoutSeconds: 5 
            failureThreshold: 6
            
          livenessProbe: 
            exec: 
              command: 
                - sh 
                - -c 
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" 
            initialDelaySeconds: 30 
            periodSeconds: 20 
            timeoutSeconds: 5 
            failureThreshold: 6
      volumes:
        - name: init-script
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
